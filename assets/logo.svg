<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- 10%+ safe margin: all artwork within (28, 28) to (228, 228) -->
  <defs>
    <linearGradient id="shieldGrad" x1="40" y1="32" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="64" y1="64" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- Outer Security Shield & Blueprint Hexagon -->
  <path d="M128 32 L212 68 V132 C212 180 174 212 128 226 C82 212 44 180 44 132 V68 L128 32 Z"
        fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="10" stroke-linejoin="round"/>
  <!-- Inner Circuit / Team Nodes -->
  <circle cx="128" cy="88" r="12" fill="#38BDF8"/>
  <circle cx="88" cy="144" r="12" fill="#818CF8"/>
  <circle cx="168" cy="144" r="12" fill="#F472B6"/>
  <circle cx="128" cy="176" r="10" fill="#34D399"/>
  <!-- Connecting Architecture Lines -->
  <path d="M128 100 L88 132 M128 100 L168 132 M88 156 L128 166 M168 156 L128 166 M100 144 H156"
        stroke="url(#innerGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Center Compass / Forge Anvil Accent -->
  <polygon points="128,114 142,134 128,150 114,134" fill="#F8FAFC"/>
</svg>
